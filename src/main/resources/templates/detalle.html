<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle Alumno</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Detalle Alumno</h3>
        </div>

        <div class="card-body">

            <p><strong>ID:</strong> <span th:text="${alumno.id}"></span></p>

            <p><strong>Número Control:</strong>
                <span th:text="${alumno.numControl}"></span>
            </p>

            <p><strong>Nombre:</strong>
                <span th:text="${alumno.nombre}"></span>
            </p>

            <p><strong>Primer Apellido:</strong>
                <span th:text="${alumno.primerAp}"></span>
            </p>

            <p><strong>Segundo Apellido:</strong>
                <span th:text="${alumno.segundoAp}"></span>
            </p>

            <p><strong>Fecha Nacimiento:</strong>
                <span th:text="${alumno.fechaNac}"></span>
            </p>

            <p><strong>Semestre:</strong>
                <span th:text="${alumno.semestre}"></span>
            </p>

            <p><strong>Carrera:</strong>
                <span th:text="${alumno.carrera}"></span>
            </p>

            <a href="/alumnos" class="btn btn-secondary">
                Regresar
            </a>

        </div>

    </div>

</div>

</body>
</html>
