<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Alumno</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Formulario Alumno</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/alumnos/guardar}" th:object="${alumno}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label>Número de Control</label>
                    <input type="text" class="form-control" th:field="*{numControl}">
                </div>

                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}">
                </div>

                <div class="mb-3">
                    <label>Primer Apellido</label>
                    <input type="text" class="form-control" th:field="*{primerAp}">
                </div>

                <div class="mb-3">
                    <label>Segundo Apellido</label>
                    <input type="text" class="form-control" th:field="*{segundoAp}">
                </div>

                <div class="mb-3">
                    <label>Fecha Nacimiento</label>
                    <input type="date" class="form-control" th:field="*{fechaNac}">
                </div>

                <div class="mb-3">
                    <label>Semestre</label>
                    <input type="number" class="form-control" th:field="*{semestre}">
                </div>

                <div class="mb-3">
                    <label>Carrera</label>
                    <input type="text" class="form-control" th:field="*{carrera}">
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

                <a href="/alumnos" class="btn btn-secondary">
                    Regresar
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
