<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Escolares</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- DataTables -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">Servicios Escolares</h1>

    <!-- BOTON -->
    <a href="/alumnos/nuevo" class="btn btn-success mb-3">
        AGREGAR
    </a>

    <!-- CARD -->
    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Listado de Alumnos</h3>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table id="tablaAlumnos"
                       class="table table-striped table-bordered table-hover text-center align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>Número de Control</th>
                        <th>Nombre Completo</th>
                        <th>Semestre</th>
                        <th>Fecha Nacimiento</th>
                        <th>Carrera</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="a : ${alumnos}">

                        <!-- NUMERO CONTROL -->
                        <td th:text="${a.numControl}"></td>

                        <!-- NOMBRE COMPLETO -->
                        <td>
                            <span th:text="${a.nombre}"></span>
                            <span th:text="${a.primerAp}"></span>
                            <span th:text="${a.segundoAp}"></span>
                        </td>

                        <!-- SEMESTRE -->
                        <td th:text="${a.semestre}"></td>

                        <!-- FECHA -->
                        <td th:text="${a.fechaNac}"></td>

                        <!-- CARRERA -->
                        <td th:text="${a.carrera}"></td>

                        <!-- BOTONES -->
                        <td>

                            <a class="btn btn-primary btn-sm"
                               th:href="@{/alumnos/detalle/{id}(id=${a.id})}">
                                Detalle
                            </a>

                            <a class="btn btn-warning btn-sm"
                               th:href="@{/alumnos/editar/{id}(id=${a.id})}">
                                Editar
                            </a>

                            <a class="btn btn-danger btn-sm"
                               th:href="@{/alumnos/eliminar/{id}(id=${a.id})}"
                               onclick="return confirmarEliminacion()">
                                Eliminar
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- JQUERY -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- DATATABLE -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    // Confirmar eliminación Alumno
    function confirmarEliminacion() {
        return confirm("¿Eliminar alumno?");
    }

    // DATATABLE
    $(document).ready(function () {

        $('#tablaAlumnos').DataTable({

            pageLength: 5,

            lengthMenu: [5, 10, 25, 50],

            language: {

                lengthMenu: "Mostrar _MENU_ registros",

                zeroRecords: "No se encontraron resultados",

                info: "Mostrando registros del _START_ al _END_ de _TOTAL_ registros",

                infoEmpty: "Mostrando registros del 0 al 0 de 0 registros",

                infoFiltered: "(filtrado de _MAX_ registros totales)",

                search: "Buscar:",

                paginate: {
                    first: "Primero",
                    last: "Último",
                    next: "Siguiente",
                    previous: "Anterior"
                }

            }

        });

    });

</script>

</body>
</html>
